<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <!-- Mapa de desplazamiento, no imagen del titular. R=128 mantiene X;
       G dibuja una curva editorial suave y determinista sobre el eje Y. -->
  <defs>
    <linearGradient id="curva" x1="0" y1="0" x2="1" y2="0" color-interpolation="sRGB">
      <stop offset="0" stop-color="rgb(128,158,128)"/>
      <stop offset=".18" stop-color="rgb(128,115,128)"/>
      <stop offset=".4" stop-color="rgb(128,94,128)"/>
      <stop offset=".62" stop-color="rgb(128,143,128)"/>
      <stop offset=".8" stop-color="rgb(128,170,128)"/>
      <stop offset="1" stop-color="rgb(128,116,128)"/>
    </linearGradient>
    <filter id="suavizado" x="-30%" y="-100%" width="160%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="35 0"/>
    </filter>
  </defs>
  <rect x="-300" y="-300" width="1600" height="840" fill="rgb(128,128,128)"/>
  <rect x="0" y="-100" width="1000" height="440" fill="url(#curva)" filter="url(#suavizado)"/>
</svg>
